<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonora RP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Orbs animados ── */
    .orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: orbFloat linear infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #1a6b3a 0%, transparent 70%);
      top: -120px; left: -120px;
      animation-duration: 20s;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #0f4a2a 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation-duration: 25s;
      animation-delay: -8s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #14532d 0%, transparent 70%);
      top: 40%; left: 55%;
      animation-duration: 18s;
      animation-delay: -4s;
    }

    @keyframes orbFloat {
      0%   { opacity: 0;    transform: translate(0, 0) scale(1); }
      10%  { opacity: 0.6; }
      50%  { transform: translate(30px, -40px) scale(1.08); opacity: 0.5; }
      90%  { opacity: 0.6; }
      100% { opacity: 0;    transform: translate(-20px, 30px) scale(0.94); }
    }

    /* ── Ruido / grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
    }

    /* ── Card principal ── */
    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(48px) saturate(180%);
      -webkit-backdrop-filter: blur(48px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      padding: 48px 36px 40px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 8px 32px rgba(0, 0, 0, 0.5),
        0 32px 64px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transform: translateY(24px) scale(0.97);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Icono / avatar ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      position: relative;
    }
    .icon-bg {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #22c55e, #16a34a, #15803d, #22c55e);
      animation: spinSlow 6s linear infinite;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .icon-bg.visible { opacity: 1; }
    .icon-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0a0a0a;
      border: 2px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }
    .icon-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    /* ── Spinner de carga ── */
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.4);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .badge-success {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .badge-error {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .badge-loading {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-success .badge-dot { animation: pulse-dot 1.4s ease infinite; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Tipografía ── */
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.4px;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.6;
      font-weight: 400;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 28px 0;
    }

    /* ── Footer hint ── */
    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      font-weight: 400;
    }

    /* ── Username pill ── */
    .username-pill {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
    }

    /* Error orbs son rojos */
    body.state-error .orb-1 {
      background: radial-gradient(circle, #7f1d1d 0%, transparent 70%);
    }
    body.state-error .orb-2 {
      background: radial-gradient(circle, #991b1b 0%, transparent 70%);
    }
    body.state-error .orb-3 {
      background: radial-gradient(circle, #7f1d1d 0%, transparent 70%);
    }
  </style>
</head>
<body>

  <div class="orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="card" id="card">
    <div class="icon-wrap" id="icon-wrap">
      <div class="icon-bg" id="icon-bg"></div>
      <div class="icon-inner" id="icon-inner">
        <div class="spinner" id="spinner"></div>
      </div>
    </div>

    <div class="badge badge-loading" id="badge">
      <span class="badge-dot"></span>
      Verificando
    </div>

    <h1 id="title">Conectando con Roblox</h1>
    <p class="subtitle" id="subtitle">Un momento…</p>

    <div class="divider"></div>
    <p class="hint" id="hint">Puedes cerrar esta ventana después.</p>
  </div>

  <script>
    const ROBLOX_CLIENT_ID = "4269442493051477939";
    const ROBLOX_CLIENT_SECRET = "RBX-yTVBuq7blUyWrCvmwEMGDwXNDeAMHiQ9hXJHsYtEerntbf2ccDObK9K1FvAhrxUu";
    const DISCORD_BOT_TOKEN = "MTUyODg3Mjc3MzAwMTUyMzgwOQ.G5267x.u8_d-0s6eCqjR8h_l2iT3a8t_";
    const GUILD_ID = "1528571127352262866";
    const VERIFIED_ROLE_IDS = ["1529584400126181516", "1528974991813771304", "1531425281502613675"];
    const UNVERIFIED_ROLE_ID = "1528974924805312562";
    const LOG_CHANNEL_ID = "1528981341461544970";

    const badge   = document.getElementById('badge');
    const title   = document.getElementById('title');
    const subtitle= document.getElementById('subtitle');
    const hint    = document.getElementById('hint');
    const iconInner = document.getElementById('icon-inner');
    const iconBg  = document.getElementById('icon-bg');
    const spinner = document.getElementById('spinner');

    function setSuccess(username, avatarUrl) {
      document.body.classList.add('state-success');

      // Icono
      if (avatarUrl) {
        iconInner.innerHTML = `<img src="${avatarUrl}" alt="">`;
      } else {
        iconInner.innerHTML = '✓';
        iconInner.style.fontSize = '26px';
        iconInner.style.color = '#4ade80';
      }
      iconBg.classList.add('visible');

      badge.className = 'badge badge-success';
      badge.innerHTML = '<span class="badge-dot"></span> Verificado';

      title.textContent = 'Verificación completada';
      subtitle.innerHTML = `Bienvenido a Sonora RP<br><span class="username-pill">@${username}</span>`;
      hint.textContent = 'Puedes cerrar esta ventana y volver a Discord.';
    }

    function setError(msg) {
      document.body.classList.add('state-error');

      iconInner.innerHTML = '✕';
      iconInner.style.fontSize = '26px';
      iconInner.style.color = '#f87171';

      badge.className = 'badge badge-error';
      badge.innerHTML = '<span class="badge-dot"></span> Error';

      title.textContent = 'No se pudo verificar';
      subtitle.textContent = msg || 'Intenta nuevamente desde Discord.';
      hint.textContent = 'Cierra esta ventana y genera un nuevo enlace.';
    }

    async function run() {
      const p = new URLSearchParams(window.location.search);
      const code  = p.get('code');
      const state = p.get('state');
      const error = p.get('error');

      if (error) { setError('Autenticación cancelada.'); return; }
      if (!code || !state) { setError('Enlace inválido.'); return; }

      let discordUserId = '';
      try {
        const payloadB64 = state.split('.')[0];
        const decoded = atob(payloadB64.replace(/-/g,'+').replace(/_/g,'/'));
        discordUserId = JSON.parse(decoded).discordUserId || '';
      } catch {}

      try {
        // Token exchange
        const tokenRes = await fetch('https://apis.roblox.com/oauth/v1/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: ROBLOX_CLIENT_ID,
            client_secret: ROBLOX_CLIENT_SECRET,
            grant_type: 'authorization_code',
            code
          })
        });
        if (!tokenRes.ok) { setError('Error al conectar con Roblox.'); return; }
        const { access_token } = await tokenRes.json();

        // User info
        const uRes = await fetch('https://apis.roblox.com/oauth/v1/userinfo', {
          headers: { Authorization: `Bearer ${access_token}` }
        });
        if (!uRes.ok) { setError('No se pudo obtener el perfil.'); return; }
        const u = await uRes.json();
        const robloxId = Number(u.sub);
        const username = u.preferred_username || u.name || `User_${robloxId}`;

        // Avatar
        let avatar = u.picture || '';
        if (!avatar) {
          try {
            const t = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${robloxId}&size=150x150&format=Png&isCircular=false`);
            if (t.ok) { const d = await t.json(); avatar = d.data?.[0]?.imageUrl || ''; }
          } catch {}
        }

        // Discord roles
        if (discordUserId) {
          const mRes = await fetch(`https://discord.com/api/v10/guilds/${GUILD_ID}/members/${discordUserId}`, {
            headers: { Authorization: `Bot ${DISCORD_BOT_TOKEN}` }
          });
          if (mRes.ok) {
            const m = await mRes.json();
            const roles = new Set(m.roles || []);
            VERIFIED_ROLE_IDS.forEach(r => roles.add(r));
            roles.delete(UNVERIFIED_ROLE_ID);
            await fetch(`https://discord.com/api/v10/guilds/${GUILD_ID}/members/${discordUserId}`, {
              method: 'PATCH',
              headers: { Authorization: `Bot ${DISCORD_BOT_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ roles: [...roles], nick: username })
            });
          }

          // Log
          fetch(`https://discord.com/api/v10/channels/${LOG_CHANNEL_ID}/messages`, {
            method: 'POST',
            headers: { Authorization: `Bot ${DISCORD_BOT_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              embeds: [{
                title: '✅ Verificación completada',
                description: `<@${discordUserId}> vinculó su cuenta de Roblox.`,
                color: 0x22c55e,
                thumbnail: { url: avatar || 'https://images.rbxcdn.com/264531478229e71e72e1c3e38706d8a3.png' },
                fields: [
                  { name: 'Discord', value: `<@${discordUserId}>`, inline: true },
                  { name: 'Roblox', value: `\`@${username}\``, inline: true },
                  { name: 'Perfil', value: `[Ver](https://www.roblox.com/users/${robloxId}/profile)`, inline: true }
                ],
                footer: { text: new Date().toLocaleString('es-MX') }
              }]
            })
          }).catch(() => {});
        }

        setSuccess(username, avatar);

      } catch {
        setError('Ocurrió un problema. Intenta de nuevo.');
      }
    }

    run();
  </script>
</body>
</html>
